<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta AI</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --text: #1a1a1a;
      --muted: #666;
      --border: #ddd;
      --accent: #2563eb;
      --user: #2563eb;
      --user-text: #ffffff;
      --bot: #ececf0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --panel: #1b1c1f;
        --text: #f0f0f0;
        --muted: #aaa;
        --border: #333;
        --accent: #60a5fa;
        --user: #2563eb;
        --user-text: #ffffff;
        --bot: #2a2b2f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { font-size: 1.2rem; margin: 0; }
    #status { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); }
    .bot { align-self: flex-start; background: var(--bot); }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
    }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Delta AI</h1>
    <div id="status">Connecting to Delta...</div>
  </header>

  <div id="chat"></div>

  <form id="form">
    <button type="button" id="load" disabled>Load AI</button>
    <input id="input" placeholder="Say something..." autocomplete="off" disabled>
    <button id="send" disabled>Send</button>
  </form>

  <script type="module">
    // Two brains: the real Delta model (Ollama on the owner's PC, via the
    // Cloudflare tunnel in config.json), or a small model that runs in the
    // visitor's browser when Delta is offline.
    const BROWSER_MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
    const BROWSER_SYSTEM = "You are Delta AI, a friendly and helpful assistant. Keep answers short.";

    const statusEl = document.getElementById("status");
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const loadBtn = document.getElementById("load");

    const history = []; // user/assistant turns only
    let deltaServer = null;
    let engine = null;

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "bot");
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function ready(statusText, greeting) {
      statusEl.textContent = statusText;
      loadBtn.style.display = "none";
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      addMessage("bot", greeting);
    }

    async function connectToDelta() {
      try {
        const config = await (await fetch("config.json", { cache: "no-store" })).json();
        const res = await fetch(config.deltaServer + "/health", { signal: AbortSignal.timeout(5000) });
        if (!res.ok) throw new Error();
        deltaServer = config.deltaServer;
        ready("Connected to Delta 🟢", "Hi! I'm Delta. What's on your mind?");
      } catch {
        statusEl.textContent = "Delta is offline right now 🔴 — you can load a small backup AI instead (~300 MB download, runs on your device).";
        loadBtn.textContent = "Load backup AI";
        loadBtn.disabled = false;
      }
    }

    loadBtn.addEventListener("click", async () => {
      if (!navigator.gpu) {
        statusEl.textContent = "Sorry, your browser doesn't support WebGPU. Try the latest Chrome or Edge on a computer.";
        return;
      }
      loadBtn.disabled = true;
      try {
        const webllm = await import("https://esm.run/@mlc-ai/web-llm");
        engine = await webllm.CreateMLCEngine(BROWSER_MODEL, {
          initProgressCallback: (p) => { statusEl.textContent = p.text; }
        });
        ready("Backup AI ready (running on your device).", "Hi! I'm the backup Delta AI. Ask me anything.");
      } catch (err) {
        statusEl.textContent = "Failed to load: " + err.message;
        loadBtn.disabled = false;
      }
    });

    async function* askDelta() {
      const res = await fetch(deltaServer + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || "Delta didn't respond.");
      }
      // Ollama streams one JSON object per line.
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (line.trim()) yield JSON.parse(line).message?.content || "";
        }
      }
    }

    async function* askBrowserModel() {
      const stream = await engine.chat.completions.create({
        messages: [{ role: "system", content: BROWSER_SYSTEM }, ...history],
        stream: true,
      });
      for await (const chunk of stream) yield chunk.choices[0]?.delta?.content || "";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || (!deltaServer && !engine)) return;
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      addMessage("user", text);
      history.push({ role: "user", content: text });
      const botDiv = addMessage("bot", "...");

      try {
        let reply = "";
        for await (const piece of (deltaServer ? askDelta() : askBrowserModel())) {
          reply += piece;
          botDiv.textContent = reply;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
        history.push({ role: "assistant", content: reply });
      } catch (err) {
        botDiv.textContent = "Error: " + err.message;
        history.pop();
      }

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    });

    connectToDelta();
  </script>
</body>
</html>
