<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb547'/%3E%3Cstop offset='1' stop-color='%23f2613a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='12' fill='url(%23g)'/%3E%3Cpath d='M20 10 L30 28 H10 Z' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /* Delta's palette: "dawn" — night ink with a sunrise accent. */
    :root {
      --bg: #fbf7f2;
      --bg-glow: rgba(242, 97, 58, 0.10);
      --panel: rgba(255, 255, 255, 0.85);
      --text: #1d1b26;
      --muted: #6b6676;
      --border: #e9e1d6;
      --dawn-1: #ffb547;
      --dawn-2: #f2613a;
      --delta-bubble: #ffffff;
      --user-bubble: #2b2840;
      --user-text: #ffffff;
      --online: #22c55e;
      --offline: #ef4444;
      --shadow: 0 1px 2px rgba(29, 27, 38, 0.06), 0 4px 16px rgba(29, 27, 38, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12111c;
        --bg-glow: rgba(242, 97, 58, 0.16);
        --panel: rgba(27, 25, 40, 0.85);
        --text: #f3eff8;
        --muted: #9c96ab;
        --border: #2c2940;
        --delta-bubble: #201e30;
        --user-bubble: #f2613a;
        --user-text: #ffffff;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-glow), transparent 70%),
        var(--bg);
    }

    /* Header: avatar + name tag */
    header {
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 1.3rem;
      padding: 4px;
    }
    .avatar {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      position: relative;
    }
    .avatar svg { width: 100%; height: 100%; display: block; }
    .avatar .face {
      border-radius: 50%;
      background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2));
    }
    .avatar .dot {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      border: 2px solid var(--bg);
      transition: background 0.3s;
    }
    .avatar .dot.online { background: var(--online); }
    .avatar .dot.offline { background: var(--offline); }
    .nametag { min-width: 0; }
    .nametag h1 {
      margin: 0;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2));
    }
    .tagline { margin: 2px 0 0; font-size: 0.82rem; color: var(--muted); }

    /* Layout: character stage + conversation */
    .app {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    @media (min-width: 900px) {
      .app { grid-template-columns: 340px 1fr; grid-template-rows: 1fr; }
    }

    /* Character stage */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 16px 4px;
      border-bottom: 1px solid var(--border);
    }
    @media (min-width: 900px) {
      .stage { border-bottom: none; border-right: 1px solid var(--border); padding: 24px; }
    }
    #character { width: 140px; height: auto; overflow: visible; }
    @media (min-width: 900px) {
      #character { width: 270px; }
    }
    .mood {
      margin: 4px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
      font-style: italic;
    }

    /* Character. Most motion is driven by the animation loop in the script;
       only the sleepy "z"s and the hair-clip twinkle are plain CSS. */
    #character .spark {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 2.8s ease-in-out infinite;
    }
    #character[data-state="thinking"] .spark { animation-duration: 0.9s; }
    #character[data-state="sleeping"] .spark { opacity: 0.4; }
    #character .zzz { opacity: 0; transform-box: fill-box; transform-origin: center; }
    #character[data-state="sleeping"] .zzz { animation: zzz 3s ease-in-out infinite; }
    #character[data-state="sleeping"] .zzz:nth-of-type(2) { animation-delay: 1s; }
    #character[data-state="sleeping"] .zzz:nth-of-type(3) { animation-delay: 2s; }

    @keyframes twinkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; }
      50% { transform: scale(1.25) rotate(20deg); opacity: 1; }
    }
    @keyframes zzz {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(14px, -26px) scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #character * { animation: none !important; }
    }

    /* Conversation */
    .convo {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    .row { display: flex; gap: 10px; align-items: flex-end; }
    .row.user { justify-content: flex-end; }
    .row .avatar { width: 30px; height: 30px; }
    .stack { display: flex; flex-direction: column; gap: 4px; max-width: 80%; }
    .row.user .stack { align-items: flex-end; }
    .who { font-size: 0.75rem; font-weight: 600; color: var(--muted); padding: 0 4px; }
    .row.delta .who { color: var(--dawn-2); }
    .msg {
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: var(--shadow);
    }
    .row.delta .msg {
      background: var(--delta-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .row.user .msg {
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 6px;
    }
    .notice {
      align-self: center;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.5;
    }

    /* Typing indicator */
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dawn-2);
      opacity: 0.4;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input bar */
    footer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px 6px;
      max-width: 760px;
      margin: 0 auto;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: var(--dawn-2); box-shadow: 0 0 0 3px var(--bg-glow); }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2));
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { filter: brightness(1.05); }
    button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
    .fineprint {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px 10px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
    }
    .fineprint a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="back" href="./" aria-label="Back to home">←</a>
      <div class="avatar" id="header-avatar"><span class="dot" id="dot"></span></div>
      <div class="nametag">
        <h1>Delta <span class="badge">AI</span></h1>
        <p class="tagline" id="status">Waking up...</p>
      </div>
    </div>
  </header>

  <main class="app">
    <section class="stage" aria-label="Delta's character">
      <!-- Delta, drawn in layers like a Live2D model. The script moves each layer by a
           different amount (parallax), swings the hair with spring physics, blinks and talks. -->
      <svg id="character" viewBox="0 0 200 230" data-state="sleeping" role="img" aria-label="Delta">
        <defs>

            <stop offset="1" stop-color="#e8823a"/>
          </linearGradient>
          <radialGradient id="skin-grad" cx="0.5" cy="0.42" r="0.62">
            <stop offset="0" stop-color="#fff3ea"/>

          <linearGradient id="iris-grad" x1="0" y1="0" x2="0" y2="1">

          </linearGradient>

            <stop offset="0.35" stop-color="#ffffff"/>
          </linearGradient>
          <radialGradient id="blush-grad">
            <stop offset="0" stop-color="#ff6f86" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#ff6f86" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="top-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a3556"/>
            <stop offset="1" stop-color="#211e33"/>
          </linearGradient>
          <linearGradient id="fade-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0.8" stop-color="#fff"/>
            <stop offset="1" stop-color="#000"/>
          </linearGradient>
          <mask id="fade-bottom"><rect width="200" height="230" fill="url(#fade-grad)"/></mask>
          <clipPath id="clip-eye-l"><ellipse cx="84" cy="112" rx="9.5" ry="11"/></clipPath>
          <clipPath id="clip-eye-r"><ellipse cx="116" cy="112" rx="9.5" ry="11"/></clipPath>
          <clipPath id="clip-face"><path d="M63 98 C63 68 80 56 100 56 C120 56 137 68 137 98 C137 122 128 140 112 152 Q100 160 88 152 C72 140 63 122 63 98 Z"/></clipPath>

        <text class="zzz" x="158" y="40" font-size="10" font-weight="700" fill="#ffb547">z</text>

        <g mask="url(#fade-bottom)">
        <g id="c-body">

          </g>

          <!-- Neck and outfit -->

          <path d="M90 146 Q100 164 110 146 L110 160 Q100 170 90 160 Z" fill="#e3a28c" opacity="0.55"/>
          <path d="M30 230 C32 200 58 184 90 178 Q100 186 110 178 C142 184 168 200 170 230 Z" fill="url(#top-grad)"/>
          <path d="M84 179 L100 200 L116 179" fill="none" stroke="#f2613a" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M80 181 L100 206 L120 181" fill="none" stroke="#ffb547" stroke-width="1" opacity="0.7"/>
          <path d="M100 205 l2 4.5 l4.5 2 l-4.5 2 l-2 4.5 l-2 -4.5 l-4.5 -2 l4.5 -2 Z" fill="#ffd166"/>

          <g id="c-head">

            <g id="c-face">
              <ellipse cx="74" cy="128" rx="10" ry="5.5" fill="url(#blush-grad)"/>
              <ellipse cx="126" cy="128" rx="10" ry="5.5" fill="url(#blush-grad)"/>

                      <path d="M79 118.5 Q84 122.5 89 118.5" fill="none" stroke="#ffe0a8" stroke-width="1.3" opacity="0.85"/>
                      <ellipse cx="86.8" cy="108.6" rx="2.7" ry="3.3" fill="#fff"/>
                      <circle cx="81" cy="117" r="1.2" fill="#fff" opacity="0.9"/>
                    </g>
                    <ellipse cx="84" cy="101.5" rx="11" ry="4" fill="#5a2a3a" opacity="0.18"/>
                  </g>

                </g>
                <path class="eye-closed" d="M75 112 Q84 117.5 94 112" fill="none" stroke="#2a1414" stroke-width="2" stroke-linecap="round" opacity="0"/>

                    </g>

                  </g>
                  <path d="M127 107 Q116 97 104 104 L104.6 106.2 Q116 100.6 125.4 108.6 Z" fill="#2a1414"/>
                  <path d="M126.5 107.3 L131.2 104.2 L125.4 105.4 Z" fill="#2a1414"/>
                  <path d="M110.5 121.6 Q116 123.6 121.5 121.6" fill="none" stroke="#9a5444" stroke-width="0.8" opacity="0.7"/>
                  <path d="M125 103 Q116 96 106 100" fill="none" stroke="#c97b63" stroke-width="0.8" opacity="0.6"/>
                </g>
                <path class="eye-closed" d="M106 112 Q116 117.5 125 112" fill="none" stroke="#2a1414" stroke-width="2" stroke-linecap="round" opacity="0"/>
              </g>

              <path d="M100.5 123 Q99.5 126 101.5 126.5" fill="none" stroke="#d58b74" stroke-width="1" stroke-linecap="round"/>

              <path id="c-smile" d="M95 136 Q100 139.5 105 136" fill="none" stroke="#b5474a" stroke-width="1.6" stroke-linecap="round"/>
              <g id="c-mouth-open" class="mouth-open" transform="matrix(1 0 0 0 0 135.5)">

            <g id="c-ahoge">

        </g>
        </g>
      </svg>
      <p class="mood" id="mood">zzz...</p>
    </section>

    <div class="convo">
      <div id="chat"></div>
      <footer>
        <form id="form">
          <button type="button" id="load" hidden>Load backup AI</button>
          <input id="input" placeholder="Say something to Delta..." autocomplete="off" disabled>
          <button id="send" disabled>Send</button>
        </form>
        <p class="fineprint">
          Delta is an AI and can be wrong. Nothing you say is saved.
          Built on Gemma — <a href="https://ai.google.dev/gemma/terms" target="_blank" rel="noopener">Gemma Terms of Use</a>.
        </p>
      </footer>
    </div>
  </main>

  <script type="module">
    // Two brains: the real Delta model (Ollama on the owner's PC, via the
    // Cloudflare tunnel in config.json), or a small model that runs in the
    // visitor's browser when Delta is offline.
    const BROWSER_MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
    const BROWSER_SYSTEM = "You are Delta AI, a friendly and helpful assistant. Keep answers short.";

    const statusEl = document.getElementById("status");
    const dotEl = document.getElementById("dot");
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const loadBtn = document.getElementById("load");
    // Small avatars are a static close-up of the character's face, cloned once
    // before the animation starts so they never copy a mid-blink frame.
    const avatarTemplate = (() => {
      const face = document.getElementById("character").cloneNode(true);
      face.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
      face.querySelectorAll(".zzz, .mouth-open, .eye-closed").forEach((el) => el.remove());
      face.removeAttribute("id");
      face.removeAttribute("data-state");
      face.removeAttribute("role");
      face.setAttribute("aria-hidden", "true");
      face.setAttribute("viewBox", "54 44 92 92");
      face.classList.add("face");
      return face;
    })();
    const makeAvatar = () => avatarTemplate.cloneNode(true);

    document.getElementById("header-avatar").prepend(makeAvatar());

    // ---- Character: a Live2D-style rig driven by one animation loop ----
    const character = (() => {
      const svg = document.getElementById("character");
      const moodEl = document.getElementById("mood");
      const part = (id) => svg.querySelector("#" + id);
      const body = part("c-body");
      const hairBack = part("c-hair-back");
      const head = part("c-head");
      const face = part("c-face");
      const bangs = part("c-bangs");
      const lockL = part("c-lock-l");
      const lockR = part("c-lock-r");
      const ahoge = part("c-ahoge");
      const smile = part("c-smile");
      const mouth = part("c-mouth-open");
      const eyes = [...svg.querySelectorAll(".eye")].map((eye) => ({
        open: eye.querySelector(".eye-open"),
        closed: eye.querySelector(".eye-closed"),
        pupil: eye.querySelector(".pupil"),
        cy: Number(eye.dataset.cy),
      }));

      const moods = {
        sleeping: "zzz...",
        idle: "",
        listening: "listening...",
        thinking: "hmm...",
        talking: "",
      };
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let state = "sleeping";
      let pointer = null;
      let pointerTime = -Infinity;
      let listenTimer = null;
      let talkTimer = null;
      let blinkUntil = 0;
      let nextBlink = 0;

      // Smoothed values chase their targets every frame; springs give the hair its lag and bounce.
      const cur = { lx: 0, ly: 0.5, tilt: 7, blink: 1, mouth: 0 };
      const ease = { lx: 0.07, ly: 0.07, tilt: 0.05, blink: 0.55, mouth: 0.45 };
      const spring = () => ({ a: 0, v: 0 });
      const hair = { lockL: spring(), lockR: spring(), ahoge: spring() };

      const clamp = (v, lo = -1, hi = 1) => Math.max(lo, Math.min(hi, v));
      const f = (n) => n.toFixed(2);
      const translate = (x, y) => `translate(${f(x)} ${f(y)})`;
      const rotate = (a, cx, cy) => `rotate(${f(a)} ${cx} ${cy})`;
      const scaleY = (s, cy) => `matrix(1 0 0 ${f(s)} 0 ${f(cy * (1 - s))})`;

      // Where to look, as -1..1 on each axis, toward a point on screen.
      function lookAt(x, y) {
        const box = svg.getBoundingClientRect();
        return [
          clamp((x - (box.left + box.width / 2)) / 400),
          clamp((y - (box.top + box.height * 0.45)) / 300),
        ];
      }

      function targets(t) {
        const out = { lx: 0, ly: 0, tilt: 0, blink: 0, mouth: 0 };
        if (state === "sleeping") return { ...out, ly: 0.5, tilt: 7, blink: 1 };

        if (state === "thinking") {
          Object.assign(out, { lx: 0.55, ly: -0.75, tilt: -6 });
        } else if (state === "listening" && t - pointerTime > 1500) {
          const box = input.getBoundingClientRect();
          [out.lx, out.ly] = lookAt(box.left + box.width / 2, box.top);
          out.tilt = 3;
        } else if (pointer && t - pointerTime < 4000) {
          [out.lx, out.ly] = lookAt(pointer.x, pointer.y);
        } else if (!reduceMotion) {
          // Idle: glance around on her own.
          out.lx = Math.sin(t / 2300) * 0.45 + Math.sin(t / 900) * 0.1;
          out.ly = Math.sin(t / 3100) * 0.25;
        }

        if (state === "talking") {
          out.mouth = reduceMotion ? 0.5 : 0.3 + 0.7 * Math.abs(Math.sin(t / 55) * Math.sin(t / 137));
          out.ly += Math.sin(t / 160) * 0.08;
        }

        if (t > nextBlink) {
          blinkUntil = t + 140;
          nextBlink = t + 2000 + Math.random() * 4000;
        }
        if (t < blinkUntil) out.blink = 1;
        return out;
      }

      function step(s, target, k, damping) {
        s.v += (target - s.a) * k - s.v * damping;
        s.a += s.v;
      }

      let lastT = null;
      let springTime = 0;

      function frame(t) {
        // Scale everything by elapsed time so motion looks the same at any refresh rate.
        const frames = lastT === null ? 1 : Math.min(4, (t - lastT) / 16.67);
        lastT = t;
        const goal = targets(t);
        for (const key in cur) cur[key] += (goal[key] - cur[key]) * (1 - Math.pow(1 - ease[key], frames));
        const { lx, ly, tilt, blink } = cur;

        const breathSpeed = state === "sleeping" ? 875 : 573;
        const breath = reduceMotion ? 0 : Math.sin(t / breathSpeed);
        const headTurn = lx * 4 + tilt;

        // Hair hangs, so it swings against the head's rotation and settles with a bounce.
        // Springs advance in fixed 60fps steps so they stay stable on fast or slow screens.
        springTime += frames;
        while (springTime >= 1) {
          step(hair.lockL, -headTurn * 0.8, 0.04, 0.12);
          step(hair.lockR, -headTurn * 0.8, 0.04, 0.12);
          step(hair.ahoge, -headTurn * 1.4 + (reduceMotion ? 0 : Math.sin(t / 700) * 4), 0.06, 0.08);
          springTime -= 1;
        }

        // Parallax: layers nearer the viewer move further, which reads as depth.
        body.setAttribute("transform", translate(lx * 0.8, -breath * 1.2));
        hairBack.setAttribute("transform", `${translate(-lx * 0.5, ly * 0.5)} ${rotate(headTurn, 100, 150)}`);
        head.setAttribute("transform", `${translate(lx * 2, ly * 1.5)} ${rotate(headTurn, 100, 150)}`);
        face.setAttribute("transform", translate(lx * 3.5, ly * 2.5));
        bangs.setAttribute("transform", translate(lx * 4.5, ly * 1.5));
        lockL.setAttribute("transform", `${translate(lx, 0)} ${rotate(hair.lockL.a, 66, 86)}`);
        lockR.setAttribute("transform", `${translate(lx, 0)} ${rotate(hair.lockR.a, 134, 86)}`);
        ahoge.setAttribute("transform", `${translate(lx * 4, ly)} ${rotate(hair.ahoge.a, 103, 43)}`);

        for (const eye of eyes) {
          eye.open.setAttribute("transform", scaleY(1 - blink * 0.92, eye.cy));
          eye.open.setAttribute("opacity", f(1 - clamp((blink - 0.7) / 0.3, 0, 1)));
          eye.closed.setAttribute("opacity", f(clamp((blink - 0.55) / 0.35, 0, 1)));
          eye.pupil.setAttribute("transform", translate(lx * 2.2, ly * 2.2));
        }

        mouth.setAttribute("transform", scaleY(cur.mouth, 135.5));
        smile.setAttribute("opacity", f(1 - clamp(cur.mouth * 2, 0, 1)));

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      window.addEventListener("pointermove", (e) => {
        pointer = { x: e.clientX, y: e.clientY };
        pointerTime = performance.now();
      });

      function set(next) {
        state = next;
        svg.dataset.state = next;
        moodEl.textContent = moods[next];
      }

      return {
        set,
        get state() { return state; },
        // While the visitor types, Delta perks up.
        listen() {
          if (state !== "idle" && state !== "listening") return;
          set("listening");
          clearTimeout(listenTimer);
          listenTimer = setTimeout(() => state === "listening" && set("idle"), 1500);
        },
        // Called for every streamed piece of a reply; the mouth stops shortly after the words do.
        talk() {
          if (state !== "talking") set("talking");
          clearTimeout(talkTimer);
          talkTimer = setTimeout(() => state === "talking" && set("idle"), 350);
        },
      };
    })();

    // ---- Chat ----
    const history = []; // user/assistant turns only
    let deltaServer = null;
    let engine = null;

    function scrollDown() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // Returns the bubble element so replies can stream into it.
    // Pass text = null to show the typing indicator.
    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = "row " + (role === "user" ? "user" : "delta");

      const stack = document.createElement("div");
      stack.className = "stack";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "user" ? "You" : (engine ? "Delta (backup)" : "Delta");
      const bubble = document.createElement("div");
      bubble.className = "msg";
      if (text === null) {
        bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      } else {
        bubble.textContent = text;
      }
      stack.append(who, bubble);

      if (role !== "user") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.append(makeAvatar());
        row.append(avatar);
      }
      row.append(stack);
      chatEl.append(row);
      scrollDown();
      return bubble;
    }

    function addNotice(text) {
      const p = document.createElement("p");
      p.className = "notice";
      p.textContent = text;
      chatEl.append(p);
      scrollDown();
    }

    function ready(statusText, greeting) {
      statusEl.textContent = statusText;
      dotEl.className = "dot online";
      loadBtn.hidden = true;
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      character.set("idle");
      addMessage("delta", greeting);
      character.talk();
    }

    async function connectToDelta() {
      try {
        const config = await (await fetch("config.json", { cache: "no-store" })).json();
        const res = await fetch(config.deltaServer + "/health", { signal: AbortSignal.timeout(5000) });
        if (!res.ok) throw new Error();
        deltaServer = config.deltaServer;
        ready("Online · curious about everything", "Hey. I'm Delta — I've only been around since September, so everything's still new. What's your name?");
      } catch {
        statusEl.textContent = "Offline right now";
        dotEl.className = "dot offline";
        character.set("sleeping");
        addNotice("Delta is asleep at the moment. You can load a small backup AI instead — it's a ~300 MB one-time download that runs on your own device.");
        loadBtn.hidden = false;
      }
    }

    loadBtn.addEventListener("click", async () => {
      if (!navigator.gpu) {
        addNotice("Sorry, your browser doesn't support WebGPU. Try the latest Chrome or Edge on a computer.");
        return;
      }
      loadBtn.disabled = true;
      try {
        const webllm = await import("https://esm.run/@mlc-ai/web-llm");
        engine = await webllm.CreateMLCEngine(BROWSER_MODEL, {
          initProgressCallback: (p) => { statusEl.textContent = p.text; }
        });
        ready("Backup mode · running on your device", "Hi! I'm Delta's backup — smaller and simpler, but here. Ask me anything.");
      } catch (err) {
        statusEl.textContent = "Couldn't load backup AI";
        addNotice("Failed to load: " + err.message);
        loadBtn.disabled = false;
      }
    });

    async function* askDelta() {
      const res = await fetch(deltaServer + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || "Delta didn't respond.");
      }
      // Ollama streams one JSON object per line.
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (line.trim()) yield JSON.parse(line).message?.content || "";
        }
      }
    }

    async function* askBrowserModel() {
      const stream = await engine.chat.completions.create({
        messages: [{ role: "system", content: BROWSER_SYSTEM }, ...history],
        stream: true,
      });
      for await (const chunk of stream) yield chunk.choices[0]?.delta?.content || "";
    }

    input.addEventListener("input", () => character.listen());

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || (!deltaServer && !engine)) return;
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      addMessage("user", text);
      history.push({ role: "user", content: text });
      const bubble = addMessage("delta", null);
      character.set("thinking");

      try {
        let reply = "";
        for await (const piece of (deltaServer ? askDelta() : askBrowserModel())) {
          reply += piece;
          if (reply) {
            bubble.textContent = reply;
            character.talk();
          }
          scrollDown();
        }
        history.push({ role: "assistant", content: reply });
      } catch (err) {
        bubble.textContent = "Hmm, something went wrong: " + err.message;
        history.pop();
      }
      if (character.state === "thinking") character.set("idle");

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    });

    connectToDelta();
  </script>
</body>
</html>
