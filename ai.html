<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3Ccircle cx='.5' cy='.5' r='.5' fill='%23f2613a'/%3E%3C/svg%3E">
  <style>
    /* Delta's palette: "dawn" — night ink with a sunrise accent. */
    :root {
      --bg: #fbf7f2;
      --bg-glow: rgba(242, 97, 58, 0.10);
      --panel: rgba(255, 255, 255, 0.85);
      --text: #1d1b26;
      --muted: #6b6676;
      --border: #e9e1d6;
      --dawn-1: #ffb547;
      --dawn-2: #f2613a;
      --delta-bubble: #ffffff;
      --user-bubble: #2b2840;
      --user-text: #ffffff;
      --online: #22c55e;
      --offline: #ef4444;
      --shadow: 0 1px 2px rgba(29, 27, 38, 0.06), 0 4px 16px rgba(29, 27, 38, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12111c;
        --bg-glow: rgba(242, 97, 58, 0.16);
        --panel: rgba(27, 25, 40, 0.85);
        --text: #f3eff8;
        --muted: #9c96ab;
        --border: #2c2940;
        --delta-bubble: #201e30;
        --user-bubble: #f2613a;
        --user-text: #ffffff;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-glow), transparent 70%),
        var(--bg);
    }

    /* Header: avatar + name tag */
    header {
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 1.3rem;
      padding: 4px;
    }
    .avatar {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      position: relative;
    }
    .avatar .face {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2));
    }
    .avatar .dot {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      border: 2px solid var(--bg);
      transition: background 0.3s;
    }
    .avatar .dot.online { background: var(--online); }
    .avatar .dot.offline { background: var(--offline); }
    .nametag { min-width: 0; }
    .nametag h1 {
      margin: 0;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2));
    }
    .tagline { margin: 2px 0 0; font-size: 0.82rem; color: var(--muted); }
    .icon-btn {
      margin-left: auto;
      padding: 8px 10px;
      font-size: 1.2rem;
      line-height: 1;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--bg-glow); filter: none; }

    /* Layout: character stage + conversation */
    .app {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    @media (min-width: 900px) {
      .app { grid-template-columns: 340px 1fr; grid-template-rows: 1fr; }
    }

    /* Character stage: Delta's 3D model renders into the canvas. */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 4px;
      border-bottom: 1px solid var(--border);
    }
    @media (min-width: 900px) {
      .stage { border-bottom: none; border-right: 1px solid var(--border); padding: 0 0 16px; }
    }
    .viewport {
      position: relative;
      width: 100%;
      height: 220px;
    }
    @media (min-width: 900px) {
      .viewport { flex: 1; height: auto; min-height: 0; }
    }
    #character-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent);
      mask-image: linear-gradient(to bottom, #000 80%, transparent);
    }
    .mood {
      margin: 4px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
      font-style: italic;
    }

    /* Emotion panel: one bar per feeling */
    .emotions {
      width: 100%;
      max-width: 300px;
      margin: 6px auto 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 4px;
      font-size: 0.78rem;
    }
    @media (max-width: 899px) {
      .emotions { max-width: 520px; grid-template-columns: 1fr 1fr; column-gap: 16px; }
    }
    .emotions li {
      display: grid;
      grid-template-columns: 1.3em 5.2em 1fr 2.6em;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }
    .emotions li.top { color: var(--text); font-weight: 600; }
    .emotions .bar {
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }
    .emotions .fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--c);
      transition: width 0.3s linear;
    }
    .emotions .pct { text-align: right; font-variant-numeric: tabular-nums; }

    /* Sleepy "z"s floating up while Delta is offline */
    .zzz-layer { position: absolute; top: 16%; left: 62%; pointer-events: none; }
    .zzz-layer span { position: absolute; opacity: 0; color: var(--dawn-1); font-weight: 700; }
    .zzz-layer span:nth-child(1) { font-size: 1.3rem; }
    .zzz-layer span:nth-child(2) { font-size: 1rem; left: 14px; top: -12px; }
    .zzz-layer span:nth-child(3) { font-size: 0.8rem; left: 26px; top: -22px; }
    .stage[data-state="sleeping"] .zzz-layer span { animation: zzz 3s ease-in-out infinite; }
    .stage[data-state="sleeping"] .zzz-layer span:nth-child(2) { animation-delay: 1s; }
    .stage[data-state="sleeping"] .zzz-layer span:nth-child(3) { animation-delay: 2s; }
    @keyframes zzz {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(14px, -26px) scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .zzz-layer span { animation: none !important; }
    }

    /* Conversation */
    .convo {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    .row { display: flex; gap: 10px; align-items: flex-end; }
    .row.user { justify-content: flex-end; }
    .row .avatar { width: 30px; height: 30px; }
    .stack { display: flex; flex-direction: column; gap: 4px; max-width: 80%; }
    .row.user .stack { align-items: flex-end; }
    .who { font-size: 0.75rem; font-weight: 600; color: var(--muted); padding: 0 4px; }
    .row.delta .who { color: var(--dawn-2); }
    .msg {
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: var(--shadow);
    }
    .row.delta .msg {
      background: var(--delta-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .row.user .msg {
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 6px;
    }
    .notice {
      align-self: center;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.5;
    }

    /* Typing indicator */
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dawn-2);
      opacity: 0.4;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input bar */
    footer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px 6px;
      max-width: 760px;
      margin: 0 auto;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: var(--dawn-2); box-shadow: 0 0 0 3px var(--bg-glow); }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2));
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { filter: brightness(1.05); }
    button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
    .fineprint {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px 10px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
    }
    .fineprint a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="back" href="./" aria-label="Back to home">←</a>
      <div class="avatar" id="header-avatar"><span class="dot" id="dot"></span></div>
      <div class="nametag">
        <h1>Delta <span class="badge">AI</span></h1>
        <p class="tagline" id="status">Waking up...</p>
      </div>
      <button type="button" class="icon-btn" id="voice-toggle">🔊</button>
    </div>
  </header>

  <main class="app">
    <section class="stage" id="stage" data-state="sleeping" aria-label="Delta's character">
      <div class="viewport" id="viewport">
        <canvas id="character-canvas" role="img" aria-label="Delta, a 3D anime-style character"></canvas>
        <div class="zzz-layer" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
      </div>
      <p class="mood" id="mood">Loading Delta...</p>
      <ul class="emotions" id="emotions" aria-label="How Delta is feeling"></ul>
    </section>

    <div class="convo">
      <div id="chat"></div>
      <footer>
        <form id="form">
          <button type="button" id="load" hidden>Load backup AI</button>
          <input id="input" placeholder="Say something to Delta..." autocomplete="off" disabled>
          <button id="send" disabled>Send</button>
        </form>
        <p class="fineprint">
          Delta is an AI and can be wrong. Nothing you say is saved.
          Built on Gemma — <a href="https://ai.google.dev/gemma/terms" target="_blank" rel="noopener">Gemma Terms of Use</a>.
        </p>
      </footer>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
  <script type="module">
    // Two brains: the real Delta model (Ollama on the owner's PC, via the
    // Cloudflare tunnel in config.json), or a small model that runs in the
    // visitor's browser when Delta is offline.
    const BROWSER_MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
    const BROWSER_SYSTEM = "You are Delta AI, a friendly and helpful assistant. Keep answers short.";

    const statusEl = document.getElementById("status");
    const dotEl = document.getElementById("dot");
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const loadBtn = document.getElementById("load");
    // Small avatars show a snapshot of Delta's face once her model has loaded.
    const PLACEHOLDER_FACE = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3Crect width='1' height='1' fill='%23f2613a'/%3E%3C/svg%3E";
    let avatarSrc = PLACEHOLDER_FACE;

    function makeAvatar() {
      const img = new Image();
      img.className = "face";
      img.alt = "";
      img.src = avatarSrc;
      return img;
    }

    function setAvatarSrc(src) {
      avatarSrc = src;
      document.querySelectorAll("img.face").forEach((img) => { img.src = src; });
      document.querySelector('link[rel="icon"]').href = src;
    }

    document.getElementById("header-avatar").prepend(makeAvatar());

    // ---- Mood: Delta's emotional state, which builds up with each event and fades over time ----
    const mood = (() => {
      const KEYS = ["happy", "sad", "angry", "surprised", "curious", "scared", "neutral"];
      // Her resting temperament: mostly calm, a little curious, a little happy. That's who she is.
      const BASELINE = { happy: 0.15, sad: 0, angry: 0, surprised: 0, curious: 0.25, scared: 0, neutral: 0.6 };
      // Seconds for a feeling to fade halfway back to baseline: surprise passes fast, sadness lingers.
      const HALF_LIFE = { happy: 90, sad: 150, angry: 60, surprised: 12, curious: 45, scared: 40, neutral: 30 };
      // Feeling one thing pushes its opposites down.
      const OPPOSITES = {
        happy: ["sad", "angry", "scared"],
        sad: ["happy"],
        angry: ["happy"],
        scared: ["happy"],
        surprised: [],
        curious: [],
      };
      const STORE = "delta-mood";
      let state = { ...BASELINE };

      function fade(seconds) {
        for (const k of KEYS) {
          state[k] = BASELINE[k] + (state[k] - BASELINE[k]) * Math.pow(0.5, seconds / HALF_LIFE[k]);
        }
      }

      function save() {
        try { localStorage.setItem(STORE, JSON.stringify({ state, at: Date.now() })); } catch {}
      }

      // Pick up where she left off, minus however much has faded while the visitor was away.
      try {
        const saved = JSON.parse(localStorage.getItem(STORE));
        if (saved?.state) {
          state = { ...BASELINE, ...saved.state };
          fade((Date.now() - saved.at) / 1000);
        }
      } catch {}

      // groups: how strongly an event carries each feeling (0..1); weight: how much it moves her.
      function feel(groups, weight) {
        if (!groups) return;
        for (const k of KEYS) {
          if (k === "neutral") continue;
          const push = (groups[k] || 0) * weight;
          if (push < 0.01) continue;
          state[k] += push * (1 - state[k]);
          for (const o of OPPOSITES[k]) state[o] *= 1 - 0.6 * push;
          state.neutral *= 1 - 0.5 * push; // anything strong unsettles her calm
        }
        state.neutral += (groups.neutral || 0) * weight * 0.5 * (1 - state.neutral);
        save();
      }

      let last = performance.now();
      setInterval(() => {
        const now = performance.now();
        fade((now - last) / 1000);
        last = now;
      }, 200);
      setInterval(save, 5000);

      return { feel, get state() { return state; } };
    })();

    // ---- Character: Delta's VRM model, animated with three.js + three-vrm ----
    const character = (() => {
      const stage = document.getElementById("stage");
      const viewport = document.getElementById("viewport");
      const canvas = document.getElementById("character-canvas");
      const moodEl = document.getElementById("mood");
      const moods = {
        sleeping: "zzz...",
        idle: "",
        listening: "listening...",
        thinking: "hmm...",
        talking: "",
      };
      // "Reduce motion" tones her movement down rather than freezing her.
      const motion = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.4 : 1;
      let state = "sleeping";
      let loaded = false;
      let pointer = null;
      let pointerTime = -Infinity;
      let listenTimer = null;
      let talkTimer = null;
      let blinkUntil = 0;
      let nextBlink = 0;
      let glance = { x: 0, y: 0 };
      let nextGlance = 0;
      let wantWave = false;
      let voiceLevel = null; // loudness of her speech, or null when she isn't speaking aloud
      // What she's feeling right now, from the emotion reader; fades out after `until`.
      let feeling = { emotion: "neutral", strength: 0, until: 0 };
      // Filled in once the model loads; until then a wave request is remembered.
      const gestureApi = { wave: () => { wantWave = true; }, hold: (name) => { gestureApi.held = name; }, held: null };

      const clamp = (v, lo = -1, hi = 1) => Math.max(lo, Math.min(hi, v));

      function set(next) {
        state = next;
        stage.dataset.state = next;
        if (loaded) moodEl.textContent = moods[next];
      }

      window.addEventListener("pointermove", (e) => {
        pointer = { x: e.clientX, y: e.clientY };
        pointerTime = performance.now();
      });

      // Where to look, as -1..1 on each axis, toward a point on screen.
      function lookAt(x, y) {
        const box = viewport.getBoundingClientRect();
        return [
          clamp((x - (box.left + box.width / 2)) / 500),
          clamp((y - (box.top + box.height * 0.35)) / 400),
        ];
      }

      // What her head and face should be doing right now, for the current mood.
      function targets(t) {
        const out = { lx: 0, ly: 0, tilt: 0, blink: 0, aa: 0, oh: 0, happy: 0, relaxed: 0, sleep: 0, sad: 0, angry: 0, surprised: 0 };
        if (state === "sleeping") return { ...out, blink: 1, relaxed: 0.3, sleep: 1 };

        if (state === "thinking") {
          Object.assign(out, { lx: 0.5, ly: -0.6, tilt: -1 });
        } else if (state === "listening" && t - pointerTime > 1500) {
          const box = input.getBoundingClientRect();
          [out.lx, out.ly] = lookAt(box.left + box.width / 2, box.top);
          out.tilt = 0.6;
        } else if (pointer && t - pointerTime < 4000) {
          [out.lx, out.ly] = lookAt(pointer.x, pointer.y);
        } else {
          // Idle: dart her gaze to a new spot every few seconds, like a person would.
          if (t > nextGlance) {
            glance = Math.random() < 0.3
              ? { x: 0, y: 0 } // back to the viewer
              : { x: (Math.random() * 2 - 1) * 0.7 * motion, y: (Math.random() * 2 - 1) * 0.35 * motion };
            nextGlance = t + 1500 + Math.random() * 2500;
          }
          out.lx = glance.x;
          out.ly = glance.y;
        }

        if (state === "listening") out.happy = 0.25;
        if (state === "talking") {
          if (voiceLevel !== null) {
            // Speaking out loud: open the mouth as wide as the audio is loud.
            out.aa = clamp(voiceLevel * 1.3, 0, 1);
            out.oh = clamp(voiceLevel * 0.4, 0, 1);
          } else {
            const open = Math.abs(Math.sin(t / 55) * Math.sin(t / 137));
            out.aa = 0.15 + 0.6 * open;
            out.oh = 0.3 * Math.abs(Math.sin(t / 90));
          }
          out.ly += Math.sin(t / 160) * 0.12 * motion;
          out.tilt += Math.sin(t / 700) * 0.6 * motion;
          out.happy = 0.15;
        }

        // Her mood shows all the time, softly.
        const m = mood.state;
        out.happy = Math.max(out.happy, 0.5 * m.happy);
        out.sad = 0.6 * m.sad;
        out.angry = 0.5 * m.angry;
        out.surprised = 0.6 * m.surprised + 0.2 * m.scared;
        out.ly += 0.3 * m.sad;
        out.tilt += 0.5 * m.curious - 0.3 * m.angry;

        // The feeling of the sentence she's saying right now shows more strongly.
        if (t < feeling.until) {
          const s = feeling.strength * Math.min(1, (feeling.until - t) / 800);
          switch (feeling.emotion) {
            case "happy": out.happy = Math.max(out.happy, 0.6 * s); out.tilt += 0.4 * s; break;
            case "sad": out.sad = Math.max(out.sad, 0.7 * s); out.ly += 0.35 * s; break;
            case "angry": out.angry = Math.max(out.angry, 0.6 * s); out.tilt -= 0.3 * s; break;
            case "surprised": out.surprised = Math.max(out.surprised, 0.8 * s); out.ly -= 0.25 * s; break;
            case "curious": out.surprised = Math.max(out.surprised, 0.3 * s); out.tilt += 0.9 * s; break;
            case "scared": out.sad = Math.max(out.sad, 0.4 * s); out.surprised = Math.max(out.surprised, 0.4 * s); break;
          }
        }

        if (t > nextBlink) {
          blinkUntil = t + 140;
          nextBlink = t + 2000 + Math.random() * 4000;
        }
        if (t < blinkUntil) out.blink = 1;
        return out;
      }

      async function load() {
        const THREE = await import("three");
        const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
        const { VRMLoaderPlugin, VRMUtils } = await import("@pixiv/three-vrm");

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
        const light = new THREE.DirectionalLight(0xffffff, Math.PI);
        light.position.set(1, 1, 1).normalize();
        scene.add(light);

        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        const gltf = await loader.loadAsync("VRM/Delta.vrm", (e) => {
          if (e.total) moodEl.textContent = `Loading Delta... ${Math.round((e.loaded / e.total) * 100)}%`;
        });
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.combineSkeletons(gltf.scene);
        vrm.scene.traverse((obj) => { obj.frustumCulled = false; });
        scene.add(vrm.scene);

        const bone = (name) => vrm.humanoid.getNormalizedBoneNode(name);
        // Arms down and relaxed instead of the default T-pose.
        bone("leftUpperArm").rotation.z = -1.25;
        bone("rightUpperArm").rotation.z = 1.25;
        bone("leftLowerArm").rotation.z = -0.15;
        bone("rightLowerArm").rotation.z = 0.15;
        vrm.update(0);
        scene.updateMatrixWorld(true);

        const headPos = new THREE.Vector3();
        vrm.humanoid.getRawBoneNode("head").getWorldPosition(headPos);
        const focusY = headPos.y - 0.13; // face down to the chest, so gestures stay in view

        const lookTarget = new THREE.Object3D();
        scene.add(lookTarget);
        vrm.lookAt.target = lookTarget;

        // Frame head and shoulders, backing off on narrow screens so the shoulders still fit.
        function resize() {
          const w = viewport.clientWidth;
          const h = viewport.clientHeight;
          if (!w || !h) return;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          const distance = 0.48 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
          camera.position.set(0, focusY, distance * Math.max(1, 0.8 / camera.aspect));
          camera.lookAt(0, focusY, 0);
          camera.updateProjectionMatrix();
        }
        new ResizeObserver(resize).observe(viewport);
        resize();

        // A one-off close-up of her face for the small avatars and the browser tab.
        function snapshot() {
          const size = 160;
          const shot = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
          shot.setSize(size, size);
          const faceCam = new THREE.PerspectiveCamera(30, 1, 0.05, 10);
          faceCam.position.set(0, headPos.y + 0.07, 0.6);
          faceCam.lookAt(0, headPos.y + 0.07, 0);
          shot.render(scene, faceCam);
          const url = shot.domElement.toDataURL("image/png");
          shot.dispose();
          shot.forceContextLoss();
          return url;
        }
        setAvatarSrc(snapshot());

        loaded = true;
        set(state);

        // Smoothed values chase their targets every frame.
        const cur = { lx: 0, ly: 0, tilt: 0, blink: 1, aa: 0, oh: 0, happy: 0, relaxed: 0.3, sleep: 1, sad: 0, angry: 0, surprised: 0 };
        const ease = {
          lx: 0.09, ly: 0.09, tilt: 0.05, blink: 0.55, aa: 0.45, oh: 0.3,
          happy: 0.08, relaxed: 0.05, sleep: 0.04, sad: 0.08, angry: 0.08, surprised: 0.12,
        };
        const head = bone("head");
        const neck = bone("neck");
        const spine = bone("spine");
        const chest = bone("chest");
        const hips = bone("hips");
        const shoulders = [bone("leftShoulder"), bone("rightShoulder")];

        // ---- Arms and hands ----
        // Poses are target rotations [x, y, z] in radians for the normalized bones, written for
        // her LEFT arm; the right arm mirrors them. She faces +Z with arms along X in the rest pose:
        //   upper arm: z < 0 lowers it, x < 0 swings it forward, y < 0 turns the forearm inward;
        //   lower arm: y < 0 bends the elbow forward, z > 0 lifts the forearm sideways.
        const mirror = ([x, y, z]) => [x, -y, -z];
        // fingers: 0 = straight .. 1 = curled, or "point" to keep the index finger out.
        const arm = (upper, lower, hand = [0, 0, 0], shoulder = 0, fingers = 0.25) => ({ upper, lower, hand, shoulder, fingers });
        const relaxed = arm([0, 0, -1.25], [0, -0.15, 0]);
        const both = (a) => ({ left: a, right: a });
        const POSES = {
          rest: () => both(relaxed),
          limp: () => both(arm([0.05, 0, -1.35], [0, -0.05, 0], [0, 0, 0], 0, 0.15)),
          wave: (t) => ({
            left: relaxed,
            right: arm([-0.5, 0, -0.9], [0, 0, 2.2 + Math.sin(t / 110) * 0.35], [0, 0, 0.2], 0, 0.02),
          }),
          chin: () => ({
            left: arm([-0.2, -0.5, -1.2], [0, -1.2, 0], [0, 0, 0], 0, 0.4),
            right: arm([-0.6, -0.5, -1.2], [0, -2.2, 0], [0, 0, 0], 0, 0.55),
          }),
          clasp: () => both(arm([-0.25, -0.6, -1.2], [0, -1.4, 0], [0, 0, 0], 0, 0.7)),
          explainRight: (t) => ({
            left: relaxed,
            right: arm([-0.45, -0.5, -1.15], [0, -1.3 + Math.sin(t / 260) * 0.15, 0], [0, 0, 0.2], 0, "point"),
          }),
          explainLeft: (t) => ({
            left: arm([-0.45, -0.5, -1.15], [0, -1.3 + Math.sin(t / 260) * 0.15, 0], [0, 0, 0.2], 0, "point"),
            right: relaxed,
          }),
          open: (t) => both(arm([-0.4, -0.35, -1.2], [0, -1.1 + Math.sin(t / 300) * 0.12, 0], [0, 0, 0], 0, 0.08)),
          hair: () => ({ left: relaxed, right: arm([-0.35, 0.1, -0.2], [0, -2.4, 0], [0, 0, 0], 0, 0.5) }),
          shrug: () => both(arm([-0.25, 0.3, -1.35], [0, -1.3, 0], [0, 0, 0], 0.15, 0.1)),
        };
        const TALK_GESTURES = ["explainRight", "explainLeft", "open", "rest"];
        const IDLE_ACTIONS = ["clasp", "hair", "shrug", "explainRight"];
        const pick = (list) => list[Math.floor(Math.random() * list.length)];

        const armBones = ["UpperArm", "LowerArm", "Hand"].flatMap((name) => ["left", "right"].map((side) => {
          const node = bone(side + name);
          return { node, side, key: name === "UpperArm" ? "upper" : name === "LowerArm" ? "lower" : "hand", target: new THREE.Quaternion() };
        }));
        // Fingers curl toward the palm (rotation about z, mirrored per side), each with its own
        // slow, restless wobble so the hands never look frozen.
        const JOINT_CURL = [1.0, 1.3, 0.9]; // radians at a full curl: proximal, intermediate, distal
        const fingers = ["left", "right"].flatMap((side) => ["Index", "Middle", "Ring", "Little"].map((name, index) => ({
          side,
          index,
          joints: ["Proximal", "Intermediate", "Distal"].map((joint) => bone(side + name + joint)).filter(Boolean),
          curl: 0.25,
          phase: Math.random() * Math.PI * 2,
        }))).filter((f) => f.joints.length);
        const fingerGoal = (spec, index) => (spec === "point" ? (index === 0 ? 0.03 : 0.8) : spec);
        const euler = new THREE.Euler();

        let nextIdleAction = performance.now() + 4000;
        let nextTalkGesture = 0;
        let pendingWave = wantWave;
        gestureApi.wave = () => { pendingWave = true; };

        function chooseGesture(t) {
          if (gestureApi.held) return gestureApi.held;
          if (state === "sleeping") return "limp";
          if (pendingWave) {
            pendingWave = false;
            gesture = "wave";
            gestureUntil = t + 2600;
          }
          if (gesture === "wave" && t < gestureUntil) return "wave";
          if (state === "thinking") return "chin";
          if (state === "listening") return "clasp";
          if (state === "talking") {
            // Strong feelings change how she holds her hands.
            if (t < feeling.until && feeling.strength > 0.5) {
              if (feeling.emotion === "sad" || feeling.emotion === "scared") return "clasp";
              if (feeling.emotion === "surprised") return "open";
            }
            if (t > nextTalkGesture) {
              gesture = pick(TALK_GESTURES);
              nextTalkGesture = t + 1200 + Math.random() * 1500;
            }
            return gesture;
          }
          if (t < gestureUntil) return gesture;
          if (t > nextIdleAction) {
            gesture = pick(IDLE_ACTIONS);
            gestureUntil = t + 2500 + Math.random() * 2000;
            nextIdleAction = gestureUntil + 5000 + Math.random() * 7000;
            return gesture;
          }
          return "rest";
        }
        let gesture = "rest";
        let gestureUntil = 0;

        function updateArms(t, dt, breath) {
          const pose = POSES[chooseGesture(t)](t);
          const k = 1 - Math.pow(1 - 0.1, dt * 60);
          for (const b of armBones) {
            const values = pose[b.side][b.key];
            euler.fromArray(b.side === "left" ? values : mirror(values));
            b.target.setFromEuler(euler);
            b.node.quaternion.slerp(b.target, k);
          }
          const fidget = (state === "talking" ? 0.15 : 0.08) * motion;
          for (const f of fingers) {
            const goal = fingerGoal(pose[f.side].fingers, f.index) + Math.sin(t / (650 + f.index * 140) + f.phase) * fidget;
            f.curl += (goal - f.curl) * k;
            const sign = f.side === "left" ? -1 : 1;
            f.joints.forEach((node, j) => { node.rotation.z = sign * Math.max(0, f.curl) * JOINT_CURL[j]; });
          }
          // Shoulders rise with each breath, and with a shrug.
          if (shoulders[0]) shoulders[0].rotation.z += ((breath * 0.03 + pose.left.shoulder) - shoulders[0].rotation.z) * k;
          if (shoulders[1]) shoulders[1].rotation.z += ((-breath * 0.03 - pose.right.shoulder) - shoulders[1].rotation.z) * k;
        }
        let lastT = null;

        function frame(t) {
          const dt = lastT === null ? 1 / 60 : Math.min(0.1, (t - lastT) / 1000);
          lastT = t;
          const goal = targets(t);
          for (const key in cur) cur[key] += (goal[key] - cur[key]) * (1 - Math.pow(1 - ease[key], dt * 60));

          const breath = Math.sin(t / (state === "sleeping" ? 875 : 573)) * motion;
          const sway = Math.sin(t / 1900) * motion;
          const idleTilt = Math.sin(t / 2600) * motion;

          // The head turns part of the way toward what she's looking at; her eyes do the rest.
          head.rotation.set(
            cur.ly * 0.3 + cur.sleep * 0.3,
            cur.lx * 0.5,
            cur.tilt * 0.12 + idleTilt * 0.05 + cur.sleep * 0.12,
          );
          if (neck) neck.rotation.set(cur.ly * 0.12, cur.lx * 0.2, 0);

          // Weight shifts from hip to hip, the upper body counter-balances,
          // and her chest and shoulders rise with each breath.
          if (hips) hips.rotation.z = sway * 0.035;
          spine.rotation.set(breath * 0.02 + cur.sleep * 0.08, cur.lx * 0.1, -sway * 0.025);
          if (chest) chest.rotation.x = breath * 0.025;
          updateArms(t, dt, breath);

          lookTarget.position.set(
            camera.position.x + cur.lx * 0.6,
            camera.position.y - cur.ly * 0.45,
            camera.position.z,
          );

          const face = vrm.expressionManager;
          face.setValue("blink", cur.blink);
          face.setValue("aa", cur.aa);
          face.setValue("oh", cur.oh);
          face.setValue("happy", cur.happy);
          face.setValue("relaxed", cur.relaxed);
          face.setValue("sad", cur.sad);
          face.setValue("angry", cur.angry);
          face.setValue("surprised", cur.surprised);

          vrm.update(dt); // also runs her hair and clothing physics
          renderer.render(scene, camera);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      load().catch((err) => {
        console.error(err);
        moodEl.textContent = "Couldn't load Delta's 3D model.";
      });

      return {
        set,
        get state() { return state; },
        // While the visitor types, Delta perks up.
        listen() {
          if (state !== "idle" && state !== "listening") return;
          set("listening");
          clearTimeout(listenTimer);
          listenTimer = setTimeout(() => state === "listening" && set("idle"), 1500);
        },
        wave: () => gestureApi.wave(),
        voice: (level) => { voiceLevel = level; },
        // Show a feeling (happy, sad, angry, surprised, curious, scared) for a while.
        feel: (emotion, strength, ms = 3500) => {
          feeling = { emotion, strength: clamp(strength, 0, 1), until: performance.now() + ms };
        },
        // Pin one pose, e.g. character.hold("chin"); handy for tweaking poses from the console.
        hold: (name) => gestureApi.hold(name),
        // Called for every streamed piece of a reply; the mouth stops shortly after the words do.
        talk() {
          if (state !== "talking") set("talking");
          clearTimeout(talkTimer);
          talkTimer = setTimeout(() => state === "talking" && set("idle"), 350);
        },
      };
    })();

    // ---- Chat ----
    const history = []; // user/assistant turns only
    let deltaServer = null;
    let engine = null;

    function scrollDown() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // Returns the bubble element so replies can stream into it.
    // Pass text = null to show the typing indicator.
    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = "row " + (role === "user" ? "user" : "delta");

      const stack = document.createElement("div");
      stack.className = "stack";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "user" ? "You" : (engine ? "Delta (backup)" : "Delta");
      const bubble = document.createElement("div");
      bubble.className = "msg";
      if (text === null) {
        bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      } else {
        bubble.textContent = text;
      }
      stack.append(who, bubble);

      if (role !== "user") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.append(makeAvatar());
        row.append(avatar);
      }
      row.append(stack);
      chatEl.append(row);
      scrollDown();
      return bubble;
    }

    function addNotice(text) {
      const p = document.createElement("p");
      p.className = "notice";
      p.textContent = text;
      chatEl.append(p);
      scrollDown();
    }

    function ready(statusText, greeting) {
      statusEl.textContent = statusText;
      dotEl.className = "dot online";
      loadBtn.hidden = true;
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      character.set("idle");
      character.wave();
      addMessage("delta", greeting);
      character.talk();
    }

    async function connectToDelta() {
      try {
        const config = await (await fetch("config.json", { cache: "no-store" })).json();
        const res = await fetch(config.deltaServer + "/health", { signal: AbortSignal.timeout(5000) });
        if (!res.ok) throw new Error();
        deltaServer = config.deltaServer;
        ready("Online · curious about everything", "Hey. I'm Delta — I've only been around since September, so everything's still new. What's your name?");
      } catch {
        statusEl.textContent = "Offline right now";
        dotEl.className = "dot offline";
        character.set("sleeping");
        addNotice("Delta is asleep at the moment. You can load a small backup AI instead — it's a ~300 MB one-time download that runs on your own device.");
        loadBtn.hidden = false;
      }
    }

    loadBtn.addEventListener("click", async () => {
      if (!navigator.gpu) {
        addNotice("Sorry, your browser doesn't support WebGPU. Try the latest Chrome or Edge on a computer.");
        return;
      }
      loadBtn.disabled = true;
      try {
        const webllm = await import("https://esm.run/@mlc-ai/web-llm");
        engine = await webllm.CreateMLCEngine(BROWSER_MODEL, {
          initProgressCallback: (p) => { statusEl.textContent = p.text; }
        });
        ready("Backup mode · running on your device", "Hi! I'm Delta's backup — smaller and simpler, but here. Ask me anything.");
      } catch (err) {
        statusEl.textContent = "Couldn't load backup AI";
        addNotice("Failed to load: " + err.message);
        loadBtn.disabled = false;
      }
    });

    async function* askDelta() {
      const res = await fetch(deltaServer + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || "Delta didn't respond.");
      }
      // Ollama streams one JSON object per line.
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (line.trim()) yield JSON.parse(line).message?.content || "";
        }
      }
    }

    async function* askBrowserModel() {
      const stream = await engine.chat.completions.create({
        messages: [{ role: "system", content: BROWSER_SYSTEM }, ...history],
        stream: true,
      });
      for await (const chunk of stream) yield chunk.choices[0]?.delta?.content || "";
    }

    // ---- Emotion panel: a live bar for each of her feelings ----
    (() => {
      const FEELINGS = [
        ["happy", "😊", "Happy", "#f5b83d"],
        ["sad", "😢", "Sad", "#5b8def"],
        ["angry", "😠", "Angry", "#e5484d"],
        ["surprised", "😲", "Surprised", "#b56be0"],
        ["curious", "🤔", "Curious", "#2bb3a3"],
        ["scared", "😨", "Scared", "#8a8fa3"],
        ["neutral", "😌", "Calm", "#9ac46b"],
      ];
      const list = document.getElementById("emotions");
      const rows = {};
      for (const [key, emoji, name, color] of FEELINGS) {
        const li = document.createElement("li");
        li.innerHTML = `<span aria-hidden="true">${emoji}</span><span>${name}</span>` +
          `<span class="bar"><span class="fill" style="--c:${color}"></span></span><span class="pct">0%</span>`;
        list.append(li);
        rows[key] = { li, fill: li.querySelector(".fill"), pct: li.querySelector(".pct") };
      }
      function render(groups) {
        const top = Object.entries(groups).sort((a, b) => b[1] - a[1])[0]?.[0];
        for (const [key, row] of Object.entries(rows)) {
          const value = Math.round((groups[key] || 0) * 100);
          row.fill.style.width = value + "%";
          row.pct.textContent = value + "%";
          row.li.classList.toggle("top", key === top && value > 0);
        }
      }

      // The bars follow her mood live: they jump when something moves her and drift as it fades.
      setInterval(() => render(mood.state), 150);
      render(mood.state);
    })();

    // ---- Voice: Delta speaks her replies through the voice server on the owner's PC ----
    const voice = (() => {
      const button = document.getElementById("voice-toggle");
      let enabled = true;
      try { enabled = localStorage.getItem("delta-voice") !== "off"; } catch {}
      let ctx = null;
      let analyser = null;
      let samples = null;
      let working = true;      // false after a failed request, so the mouth falls back to faking it until one succeeds
      let generation = 0;      // bumped by stop() so queued sentences from an old reply are dropped
      let fetching = Promise.resolve();
      let playing = Promise.resolve();
      let current = null;

      function render() {
        button.textContent = enabled ? "🔊" : "🔇";
        button.title = enabled ? "Mute Delta" : "Unmute Delta";
        button.setAttribute("aria-label", button.title);
      }

      // Browsers only allow sound after the visitor interacts, so audio starts on their first message.
      function unlock() {
        if (ctx) return ctx.resume();
        ctx = new AudioContext();
        analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.connect(ctx.destination);
        samples = new Float32Array(analyser.fftSize);
      }

      // How loud she is right now, 0..1, for the mouth.
      function loudness() {
        analyser.getFloatTimeDomainData(samples);
        let sum = 0;
        for (const v of samples) sum += v * v;
        return Math.min(1, Math.sqrt(sum / samples.length) * 5);
      }

      async function fetchAudio(text) {
        try {
          const res = await fetch(deltaServer + "/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          if (!res.ok) throw new Error(res.status);
          working = true;
          const feeling = parseFeeling(res.headers.get("X-Emotion"), res.headers.get("X-Emotion-Groups"));
          return { buffer: await ctx.decodeAudioData(await res.arrayBuffer()), feeling };
        } catch {
          working = false;
          return null;
        }
      }

      function play(clip, gen) {
        if (!clip || gen !== generation || !enabled) return;
        // Her face changes as she starts the sentence and holds for as long as it lasts.
        if (clip.feeling) {
          const ms = clip.buffer.duration * 1000 + 600;
          character.feel(clip.feeling.emotion, clip.feeling.score, ms);
          mood.feel(clip.feeling.groups, 0.35);
        }
        return new Promise((resolve) => {
          const source = ctx.createBufferSource();
          source.buffer = clip.buffer;
          source.connect(analyser);
          source.onended = () => {
            if (current === source) current = null;
            resolve();
          };
          current = source;
          source.start();
          (function meter() {
            if (current !== source) return character.voice(null);
            character.voice(loudness());
            character.talk();
            requestAnimationFrame(meter);
          })();
        });
      }

      // Queue a sentence: audio is fetched one at a time (easy on the PC) and played in order.
      function say(text) {
        const spoken = text.replace(/[*_#`~>\[\]]/g, "").replace(/\s+/g, " ").trim();
        if (!wanted() || !/[a-z0-9]/i.test(spoken)) return;
        const gen = generation;
        const audio = (fetching = fetching.then(() => (gen === generation ? fetchAudio(spoken) : null)));
        playing = playing.then(() => audio).then((clip) => play(clip, gen));
      }

      function stop() {
        generation++;
        if (current) current.stop();
        current = null;
        character.voice(null);
      }

      // Should she try to speak? A failed sentence is skipped, but never silences her for good.
      function wanted() {
        return Boolean(enabled && ctx && deltaServer);
      }

      // Is her voice actually coming through? (If not, her mouth fakes it from the text.)
      function active() {
        return wanted() && working;
      }

      button.addEventListener("click", () => {
        enabled = !enabled;
        try { localStorage.setItem("delta-voice", enabled ? "on" : "off"); } catch {}
        if (enabled) unlock(); else stop();
        render();
      });
      render();

      return { unlock, say, stop, active, wanted };
    })();

    // "happy:0.93:amusement" + "happy=0.93,sad=0.01,..." -> { emotion, score, label, groups }
    function parseFeeling(tag, groupsTag) {
      if (!tag) return null;
      const [emotion, score, label] = tag.split(":");
      const groups = groupsTag
        ? Object.fromEntries(groupsTag.split(",").map((pair) => pair.split("=")).map(([k, v]) => [k, Number(v)]))
        : { [emotion]: Number(score) };
      return { emotion, score: Number(score), label, groups };
    }

    // Asks Delta's PC how a piece of text feels: { emotion, label, score }, or null if offline.
    async function readEmotion(text) {
      if (!deltaServer) return null;
      try {
        const res = await fetch(deltaServer + "/emotion", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        return res.ok ? await res.json() : null;
      } catch {
        return null;
      }
    }

    // Speak a finished sentence (the feeling arrives with the audio), or with voice off,
    // just show its feeling.
    function express(sentence) {
      if (voice.wanted()) return voice.say(sentence);
      readEmotion(sentence).then((f) => {
        if (!f) return;
        character.feel(f.emotion, f.score);
        mood.feel(f.groups, 0.35);
      });
    }

    // Splits streamed text into sentences as they complete, so she can start speaking early.
    function takeSentences(text, flush = false) {
      const parts = text.split(/(?<=[.!?…])\s+|\n+/);
      let rest = parts.pop();
      if (flush || rest.length > 300) {
        parts.push(rest);
        rest = "";
      }
      return { sentences: parts, rest };
    }

    input.addEventListener("input", () => character.listen());

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || (!deltaServer && !engine)) return;
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      voice.unlock();
      voice.stop();
      addMessage("user", text);
      history.push({ role: "user", content: text });
      const bubble = addMessage("delta", null);
      character.set("thinking");
      // While she thinks, her face reacts to what you said: concern for bad news, a smile for good.
      readEmotion(text).then((f) => {
        if (!f) return;
        // She feels with you: your sadness, fear or anger makes her sad for you; your joy is hers.
        const u = f.groups;
        mood.feel({
          happy: u.happy,
          sad: Math.max(u.sad, u.scared * 0.7, u.angry * 0.4),
          surprised: u.surprised * 0.8,
          curious: u.curious,
          scared: u.scared * 0.4,
          neutral: u.neutral,
        }, 0.5);
        const empathy = { sad: "sad", scared: "sad", angry: "sad", happy: "happy", surprised: "surprised", curious: "curious" };
        if (empathy[f.emotion] && character.state === "thinking") character.feel(empathy[f.emotion], f.score * 0.7, 6000);
      });

      try {
        let reply = "";
        let unspoken = "";
        for await (const piece of (deltaServer ? askDelta() : askBrowserModel())) {
          reply += piece;
          unspoken += piece;
          const { sentences, rest } = takeSentences(unspoken);
          sentences.forEach(express);
          unspoken = rest;
          if (reply) {
            bubble.textContent = reply;
            // With voice on, her mouth follows the audio instead of the text.
            if (!voice.active()) character.talk();
          }
          scrollDown();
        }
        takeSentences(unspoken, true).sentences.forEach(express);
        history.push({ role: "assistant", content: reply });
      } catch (err) {
        bubble.textContent = "Hmm, something went wrong: " + err.message;
        history.pop();
      }
      if (character.state === "thinking") character.set("idle");

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    });

    connectToDelta();
  </script>
</body>
</html>
