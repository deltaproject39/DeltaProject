<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3Ccircle cx='.5' cy='.5' r='.5' fill='%23f2613a'/%3E%3C/svg%3E">
  <style>
    /* Delta's palette: "dawn" — night ink with a sunrise accent. */
    :root {
      --bg: #fbf7f2;
      --bg-glow: rgba(242, 97, 58, 0.10);
      --panel: rgba(255, 255, 255, 0.85);
      --text: #1d1b26;
      --muted: #6b6676;
      --border: #e9e1d6;
      --dawn-1: #ffb547;
      --dawn-2: #f2613a;
      --delta-bubble: #ffffff;
      --user-bubble: #2b2840;
      --user-text: #ffffff;
      --online: #22c55e;
      --offline: #ef4444;
      --shadow: 0 1px 2px rgba(29, 27, 38, 0.06), 0 4px 16px rgba(29, 27, 38, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12111c;
        --bg-glow: rgba(242, 97, 58, 0.16);
        --panel: rgba(27, 25, 40, 0.85);
        --text: #f3eff8;
        --muted: #9c96ab;
        --border: #2c2940;
        --delta-bubble: #201e30;
        --user-bubble: #f2613a;
        --user-text: #ffffff;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-glow), transparent 70%),
        var(--bg);
    }

    /* Header: avatar + name tag */
    header {
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 1.3rem;
      padding: 4px;
    }
    .avatar {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      position: relative;
    }
    .avatar .face {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2));
    }
    .avatar .dot {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      border: 2px solid var(--bg);
      transition: background 0.3s;
    }
    .avatar .dot.online { background: var(--online); }
    .avatar .dot.offline { background: var(--offline); }
    .nametag { min-width: 0; }
    .nametag h1 {
      margin: 0;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2));
    }
    .tagline { margin: 2px 0 0; font-size: 0.82rem; color: var(--muted); }

    /* Layout: character stage + conversation */
    .app {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    @media (min-width: 900px) {
      .app { grid-template-columns: 340px 1fr; grid-template-rows: 1fr; }
    }

    /* Character stage: Delta's 3D model renders into the canvas. */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 4px;
      border-bottom: 1px solid var(--border);
    }
    @media (min-width: 900px) {
      .stage { border-bottom: none; border-right: 1px solid var(--border); padding: 0 0 16px; }
    }
    .viewport {
      position: relative;
      width: 100%;
      height: 220px;
    }
    @media (min-width: 900px) {
      .viewport { flex: 1; height: auto; min-height: 0; }
    }
    #character-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent);
      mask-image: linear-gradient(to bottom, #000 80%, transparent);
    }
    .mood {
      margin: 4px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
      font-style: italic;
    }

    /* Sleepy "z"s floating up while Delta is offline */
    .zzz-layer { position: absolute; top: 16%; left: 62%; pointer-events: none; }
    .zzz-layer span { position: absolute; opacity: 0; color: var(--dawn-1); font-weight: 700; }
    .zzz-layer span:nth-child(1) { font-size: 1.3rem; }
    .zzz-layer span:nth-child(2) { font-size: 1rem; left: 14px; top: -12px; }
    .zzz-layer span:nth-child(3) { font-size: 0.8rem; left: 26px; top: -22px; }
    .stage[data-state="sleeping"] .zzz-layer span { animation: zzz 3s ease-in-out infinite; }
    .stage[data-state="sleeping"] .zzz-layer span:nth-child(2) { animation-delay: 1s; }
    .stage[data-state="sleeping"] .zzz-layer span:nth-child(3) { animation-delay: 2s; }
    @keyframes zzz {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(14px, -26px) scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .zzz-layer span { animation: none !important; }
    }

    /* Conversation */
    .convo {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    .row { display: flex; gap: 10px; align-items: flex-end; }
    .row.user { justify-content: flex-end; }
    .row .avatar { width: 30px; height: 30px; }
    .stack { display: flex; flex-direction: column; gap: 4px; max-width: 80%; }
    .row.user .stack { align-items: flex-end; }
    .who { font-size: 0.75rem; font-weight: 600; color: var(--muted); padding: 0 4px; }
    .row.delta .who { color: var(--dawn-2); }
    .msg {
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: var(--shadow);
    }
    .row.delta .msg {
      background: var(--delta-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .row.user .msg {
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 6px;
    }
    .notice {
      align-self: center;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.5;
    }

    /* Typing indicator */
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dawn-2);
      opacity: 0.4;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input bar */
    footer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px 6px;
      max-width: 760px;
      margin: 0 auto;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: var(--dawn-2); box-shadow: 0 0 0 3px var(--bg-glow); }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--dawn-1), var(--dawn-2));
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { filter: brightness(1.05); }
    button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
    .fineprint {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px 10px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
    }
    .fineprint a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="back" href="./" aria-label="Back to home">←</a>
      <div class="avatar" id="header-avatar"><span class="dot" id="dot"></span></div>
      <div class="nametag">
        <h1>Delta <span class="badge">AI</span></h1>
        <p class="tagline" id="status">Waking up...</p>
      </div>
    </div>
  </header>

  <main class="app">
    <section class="stage" id="stage" data-state="sleeping" aria-label="Delta's character">
      <div class="viewport" id="viewport">
        <canvas id="character-canvas" role="img" aria-label="Delta, a 3D anime-style character"></canvas>
        <div class="zzz-layer" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
      </div>
      <p class="mood" id="mood">Loading Delta...</p>
    </section>

    <div class="convo">
      <div id="chat"></div>
      <footer>
        <form id="form">
          <button type="button" id="load" hidden>Load backup AI</button>
          <input id="input" placeholder="Say something to Delta..." autocomplete="off" disabled>
          <button id="send" disabled>Send</button>
        </form>
        <p class="fineprint">
          Delta is an AI and can be wrong. Nothing you say is saved.
          Built on Gemma — <a href="https://ai.google.dev/gemma/terms" target="_blank" rel="noopener">Gemma Terms of Use</a>.
        </p>
      </footer>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
  <script type="module">
    // Two brains: the real Delta model (Ollama on the owner's PC, via the
    // Cloudflare tunnel in config.json), or a small model that runs in the
    // visitor's browser when Delta is offline.
    const BROWSER_MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
    const BROWSER_SYSTEM = "You are Delta AI, a friendly and helpful assistant. Keep answers short.";

    const statusEl = document.getElementById("status");
    const dotEl = document.getElementById("dot");
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const loadBtn = document.getElementById("load");
    // Small avatars show a snapshot of Delta's face once her model has loaded.
    const PLACEHOLDER_FACE = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3Crect width='1' height='1' fill='%23f2613a'/%3E%3C/svg%3E";
    let avatarSrc = PLACEHOLDER_FACE;

    function makeAvatar() {
      const img = new Image();
      img.className = "face";
      img.alt = "";
      img.src = avatarSrc;
      return img;
    }

    function setAvatarSrc(src) {
      avatarSrc = src;
      document.querySelectorAll("img.face").forEach((img) => { img.src = src; });
      document.querySelector('link[rel="icon"]').href = src;
    }

    document.getElementById("header-avatar").prepend(makeAvatar());

    // ---- Character: Delta's VRM model, animated with three.js + three-vrm ----
    const character = (() => {
      const stage = document.getElementById("stage");
      const viewport = document.getElementById("viewport");
      const canvas = document.getElementById("character-canvas");
      const moodEl = document.getElementById("mood");
      const moods = {
        sleeping: "zzz...",
        idle: "",
        listening: "listening...",
        thinking: "hmm...",
        talking: "",
      };
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let state = "sleeping";
      let loaded = false;
      let pointer = null;
      let pointerTime = -Infinity;
      let listenTimer = null;
      let talkTimer = null;
      let blinkUntil = 0;
      let nextBlink = 0;

      const clamp = (v, lo = -1, hi = 1) => Math.max(lo, Math.min(hi, v));

      function set(next) {
        state = next;
        stage.dataset.state = next;
        if (loaded) moodEl.textContent = moods[next];
      }

      window.addEventListener("pointermove", (e) => {
        pointer = { x: e.clientX, y: e.clientY };
        pointerTime = performance.now();
      });

      // Where to look, as -1..1 on each axis, toward a point on screen.
      function lookAt(x, y) {
        const box = viewport.getBoundingClientRect();
        return [
          clamp((x - (box.left + box.width / 2)) / 500),
          clamp((y - (box.top + box.height * 0.35)) / 400),
        ];
      }

      // What her head and face should be doing right now, for the current mood.
      function targets(t) {
        const out = { lx: 0, ly: 0, tilt: 0, blink: 0, aa: 0, oh: 0, happy: 0, relaxed: 0, sleep: 0 };
        if (state === "sleeping") return { ...out, blink: 1, relaxed: 0.3, sleep: 1 };

        if (state === "thinking") {
          Object.assign(out, { lx: 0.5, ly: -0.6, tilt: -1 });
        } else if (state === "listening" && t - pointerTime > 1500) {
          const box = input.getBoundingClientRect();
          [out.lx, out.ly] = lookAt(box.left + box.width / 2, box.top);
          out.tilt = 0.6;
        } else if (pointer && t - pointerTime < 4000) {
          [out.lx, out.ly] = lookAt(pointer.x, pointer.y);
        } else if (!reduceMotion) {
          // Idle: glance around on her own.
          out.lx = Math.sin(t / 2300) * 0.45 + Math.sin(t / 900) * 0.1;
          out.ly = Math.sin(t / 3100) * 0.25;
        }

        if (state === "listening") out.happy = 0.25;
        if (state === "talking") {
          const open = reduceMotion ? 0.5 : Math.abs(Math.sin(t / 55) * Math.sin(t / 137));
          out.aa = 0.15 + 0.6 * open;
          out.oh = 0.3 * Math.abs(Math.sin(t / 90));
          out.ly += Math.sin(t / 160) * 0.06;
          out.happy = 0.1;
        }

        if (t > nextBlink) {
          blinkUntil = t + 140;
          nextBlink = t + 2000 + Math.random() * 4000;
        }
        if (t < blinkUntil) out.blink = 1;
        return out;
      }

      async function load() {
        const THREE = await import("three");
        const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
        const { VRMLoaderPlugin, VRMUtils } = await import("@pixiv/three-vrm");

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
        const light = new THREE.DirectionalLight(0xffffff, Math.PI);
        light.position.set(1, 1, 1).normalize();
        scene.add(light);

        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        const gltf = await loader.loadAsync("VRM/Delta.vrm", (e) => {
          if (e.total) moodEl.textContent = `Loading Delta... ${Math.round((e.loaded / e.total) * 100)}%`;
        });
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.combineSkeletons(gltf.scene);
        vrm.scene.traverse((obj) => { obj.frustumCulled = false; });
        scene.add(vrm.scene);

        const bone = (name) => vrm.humanoid.getNormalizedBoneNode(name);
        // Arms down and relaxed instead of the default T-pose.
        bone("leftUpperArm").rotation.z = -1.25;
        bone("rightUpperArm").rotation.z = 1.25;
        bone("leftLowerArm").rotation.z = -0.15;
        bone("rightLowerArm").rotation.z = 0.15;
        vrm.update(0);
        scene.updateMatrixWorld(true);

        const headPos = new THREE.Vector3();
        vrm.humanoid.getRawBoneNode("head").getWorldPosition(headPos);
        const focusY = headPos.y - 0.06; // between face and shoulders

        const lookTarget = new THREE.Object3D();
        scene.add(lookTarget);
        vrm.lookAt.target = lookTarget;

        // Frame head and shoulders, backing off on narrow screens so the shoulders still fit.
        function resize() {
          const w = viewport.clientWidth;
          const h = viewport.clientHeight;
          if (!w || !h) return;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          const distance = 0.4 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
          camera.position.set(0, focusY, distance * Math.max(1, 0.8 / camera.aspect));
          camera.lookAt(0, focusY, 0);
          camera.updateProjectionMatrix();
        }
        new ResizeObserver(resize).observe(viewport);
        resize();

        // A one-off close-up of her face for the small avatars and the browser tab.
        function snapshot() {
          const size = 160;
          const shot = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
          shot.setSize(size, size);
          const faceCam = new THREE.PerspectiveCamera(30, 1, 0.05, 10);
          faceCam.position.set(0, headPos.y + 0.07, 0.6);
          faceCam.lookAt(0, headPos.y + 0.07, 0);
          shot.render(scene, faceCam);
          const url = shot.domElement.toDataURL("image/png");
          shot.dispose();
          shot.forceContextLoss();
          return url;
        }
        setAvatarSrc(snapshot());

        loaded = true;
        set(state);

        // Smoothed values chase their targets every frame.
        const cur = { lx: 0, ly: 0, tilt: 0, blink: 1, aa: 0, oh: 0, happy: 0, relaxed: 0.3, sleep: 1 };
        const ease = { lx: 0.07, ly: 0.07, tilt: 0.05, blink: 0.55, aa: 0.45, oh: 0.3, happy: 0.08, relaxed: 0.05, sleep: 0.04 };
        const head = bone("head");
        const neck = bone("neck");
        const spine = bone("spine");
        const chest = bone("chest");
        let lastT = null;

        function frame(t) {
          const dt = lastT === null ? 1 / 60 : Math.min(0.1, (t - lastT) / 1000);
          lastT = t;
          const goal = targets(t);
          for (const key in cur) cur[key] += (goal[key] - cur[key]) * (1 - Math.pow(1 - ease[key], dt * 60));

          const breath = reduceMotion ? 0 : Math.sin(t / (state === "sleeping" ? 875 : 573));
          // The head turns part of the way toward what she's looking at; her eyes do the rest.
          head.rotation.set(cur.ly * 0.25 + cur.sleep * 0.3, cur.lx * 0.35, cur.tilt * 0.1 + cur.sleep * 0.12);
          if (neck) neck.rotation.set(cur.ly * 0.1, cur.lx * 0.15, 0);
          spine.rotation.set(breath * 0.012, cur.lx * 0.05, 0);
          if (chest) chest.rotation.x = breath * 0.015;

          lookTarget.position.set(
            camera.position.x + cur.lx * 0.6,
            camera.position.y - cur.ly * 0.45,
            camera.position.z,
          );

          const face = vrm.expressionManager;
          face.setValue("blink", cur.blink);
          face.setValue("aa", cur.aa);
          face.setValue("oh", cur.oh);
          face.setValue("happy", cur.happy);
          face.setValue("relaxed", cur.relaxed);

          vrm.update(dt); // also runs her hair and clothing physics
          renderer.render(scene, camera);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      load().catch((err) => {
        console.error(err);
        moodEl.textContent = "Couldn't load Delta's 3D model.";
      });

      return {
        set,
        get state() { return state; },
        // While the visitor types, Delta perks up.
        listen() {
          if (state !== "idle" && state !== "listening") return;
          set("listening");
          clearTimeout(listenTimer);
          listenTimer = setTimeout(() => state === "listening" && set("idle"), 1500);
        },
        // Called for every streamed piece of a reply; the mouth stops shortly after the words do.
        talk() {
          if (state !== "talking") set("talking");
          clearTimeout(talkTimer);
          talkTimer = setTimeout(() => state === "talking" && set("idle"), 350);
        },
      };
    })();

    // ---- Chat ----
    const history = []; // user/assistant turns only
    let deltaServer = null;
    let engine = null;

    function scrollDown() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // Returns the bubble element so replies can stream into it.
    // Pass text = null to show the typing indicator.
    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = "row " + (role === "user" ? "user" : "delta");

      const stack = document.createElement("div");
      stack.className = "stack";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "user" ? "You" : (engine ? "Delta (backup)" : "Delta");
      const bubble = document.createElement("div");
      bubble.className = "msg";
      if (text === null) {
        bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
      } else {
        bubble.textContent = text;
      }
      stack.append(who, bubble);

      if (role !== "user") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.append(makeAvatar());
        row.append(avatar);
      }
      row.append(stack);
      chatEl.append(row);
      scrollDown();
      return bubble;
    }

    function addNotice(text) {
      const p = document.createElement("p");
      p.className = "notice";
      p.textContent = text;
      chatEl.append(p);
      scrollDown();
    }

    function ready(statusText, greeting) {
      statusEl.textContent = statusText;
      dotEl.className = "dot online";
      loadBtn.hidden = true;
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      character.set("idle");
      addMessage("delta", greeting);
      character.talk();
    }

    async function connectToDelta() {
      try {
        const config = await (await fetch("config.json", { cache: "no-store" })).json();
        const res = await fetch(config.deltaServer + "/health", { signal: AbortSignal.timeout(5000) });
        if (!res.ok) throw new Error();
        deltaServer = config.deltaServer;
        ready("Online · curious about everything", "Hey. I'm Delta — I've only been around since September, so everything's still new. What's your name?");
      } catch {
        statusEl.textContent = "Offline right now";
        dotEl.className = "dot offline";
        character.set("sleeping");
        addNotice("Delta is asleep at the moment. You can load a small backup AI instead — it's a ~300 MB one-time download that runs on your own device.");
        loadBtn.hidden = false;
      }
    }

    loadBtn.addEventListener("click", async () => {
      if (!navigator.gpu) {
        addNotice("Sorry, your browser doesn't support WebGPU. Try the latest Chrome or Edge on a computer.");
        return;
      }
      loadBtn.disabled = true;
      try {
        const webllm = await import("https://esm.run/@mlc-ai/web-llm");
        engine = await webllm.CreateMLCEngine(BROWSER_MODEL, {
          initProgressCallback: (p) => { statusEl.textContent = p.text; }
        });
        ready("Backup mode · running on your device", "Hi! I'm Delta's backup — smaller and simpler, but here. Ask me anything.");
      } catch (err) {
        statusEl.textContent = "Couldn't load backup AI";
        addNotice("Failed to load: " + err.message);
        loadBtn.disabled = false;
      }
    });

    async function* askDelta() {
      const res = await fetch(deltaServer + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || "Delta didn't respond.");
      }
      // Ollama streams one JSON object per line.
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (line.trim()) yield JSON.parse(line).message?.content || "";
        }
      }
    }

    async function* askBrowserModel() {
      const stream = await engine.chat.completions.create({
        messages: [{ role: "system", content: BROWSER_SYSTEM }, ...history],
        stream: true,
      });
      for await (const chunk of stream) yield chunk.choices[0]?.delta?.content || "";
    }

    input.addEventListener("input", () => character.listen());

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || (!deltaServer && !engine)) return;
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      addMessage("user", text);
      history.push({ role: "user", content: text });
      const bubble = addMessage("delta", null);
      character.set("thinking");

      try {
        let reply = "";
        for await (const piece of (deltaServer ? askDelta() : askBrowserModel())) {
          reply += piece;
          if (reply) {
            bubble.textContent = reply;
            character.talk();
          }
          scrollDown();
        }
        history.push({ role: "assistant", content: reply });
      } catch (err) {
        bubble.textContent = "Hmm, something went wrong: " + err.message;
        history.pop();
      }
      if (character.state === "thinking") character.set("idle");

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    });

    connectToDelta();
  </script>
</body>
</html>
